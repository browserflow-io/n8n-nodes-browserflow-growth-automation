name: Publish Browserflow plugin
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify trusted publishing support
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          assert.ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'Trusted publishing requires npm >=11.5.1.');
          assert.ok(process.env.ACTIONS_ID_TOKEN_REQUEST_URL && process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN, 'GitHub OIDC permission is required.');
          JS
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Validate publication identity and unused version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@browserflow/n8n-nodes-browserflow-growth-automation', 'Only the new standalone package may be published.');
          assert.equal(process.env.GITHUB_REPOSITORY, 'browserflow-io/n8n-nodes-browserflow-growth-automation');
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.equal(pkg.repository.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
          assert.equal(response.status, 404, 'Version exists or registry status is uncertain; refusing publication.');
          JS
      # npm authenticates this exact workflow/environment through GitHub OIDC.
      # Do not restore a long-lived publication token as a fallback.
      - run: npm publish --provenance --access public
